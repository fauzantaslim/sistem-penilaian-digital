<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>500 — Terjadi Kesalahan | SistemPenilaian</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,800&family=Outfit:wght@300;800;900&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { 
            sans: ['"DM Sans"', 'sans-serif'],
            display: ['Outfit', 'sans-serif']
          },
          colors: { primary: { DEFAULT: '#7acbaf', dark: '#65b59a' } },
          animation: {
            'wiggle': 'wiggle 2s ease-in-out infinite',
            'fade-in-up': 'fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both'
          },
          keyframes: {
            wiggle: { '0%,100%': { transform: 'rotate(-5deg)' }, '50%': { transform: 'rotate(5deg)' } },
            fadeInUp: { '0%': { opacity: '0', transform: 'translateY(30px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
          }
        }
      }
    }
  </script>
  <style>
    body::before {
      content: ""; position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 9999;
    }
  </style>
</head>
<body class="bg-[#f4f7f6] text-gray-900 font-sans antialiased min-h-screen flex items-center justify-center p-6 overflow-hidden relative">

  <!-- Blobs -->
  <div class="absolute top-[-15%] right-[-10%] w-[50vw] h-[50vw] rounded-full bg-red-300/20 blur-[80px] pointer-events-none"></div>
  <div class="absolute bottom-[-15%] left-[-10%] w-[40vw] h-[40vw] rounded-full bg-orange-200/30 blur-[80px] pointer-events-none"></div>

  <div class="text-center max-w-lg w-full relative z-10">

    <!-- Giant 500 -->
    <div class="select-none mb-6">
      <span class="font-display font-black leading-none text-transparent bg-clip-text bg-gradient-to-br from-red-400 to-orange-500"
            style="font-size:clamp(120px,20vw,180px);">500</span>
    </div>

    <!-- Icon -->
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-red-50 border border-red-100 shadow-lg text-red-400 text-3xl mb-6 animate-wiggle">
      <i class="ph-fill ph-warning-circle"></i>
    </div>

    <div class="animate-fade-in-up">
      <h1 class="font-display text-3xl font-bold text-gray-900 mb-3">Terjadi Kesalahan Server</h1>
      <p class="text-gray-500 font-medium max-w-sm mx-auto mb-8">
        Maaf, ada masalah di pihak kami. Silakan coba lagi dalam beberapa saat.
      </p>

      <a href="{{ url_for('dashboard.index') }}"
         class="inline-flex items-center justify-center gap-2 px-8 py-4 rounded-2xl shadow-[0_8px_20px_rgba(122,203,175,0.35)] font-bold text-white bg-primary hover:bg-primary-dark hover:-translate-y-1 transition-all duration-300">
        <i class="ph-bold ph-house"></i> Kembali ke Dashboard
      </a>
    </div>

  </div>
</body>
</html>
