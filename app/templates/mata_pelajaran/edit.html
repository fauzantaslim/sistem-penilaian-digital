{% extends 'base.html' %}
{% block title %}Edit Mata Pelajaran{% endblock %}
{% block page_title %}Edit Mata Pelajaran{% endblock %}

{% block content %}
<!-- Form Card -->
<div class="w-full animate-fade-in animate-in-1">
  <div class="bg-transparent border border-gray-200/80 rounded-3xl overflow-hidden">
    <!-- Card Header -->
    <div class="px-8 py-5 bg-gray-900 text-white flex items-center justify-between">
      <div class="flex items-center gap-3">
        <i class="ph-fill ph-pencil-simple text-cyan-400 text-2xl"></i>
        <div>
          <h2 class="font-display font-bold text-white">Edit Mata Pelajaran</h2>
          <p class="text-xs text-gray-300 mt-0.5">Perbarui informasi mata pelajaran</p>
        </div>
      </div>
      <span class="bg-gray-800 text-gray-300 border border-gray-700 text-xs font-bold px-3 py-1 rounded-full">ID #{{ mapel.id }}</span>
    </div>

    <!-- Form Body -->
    <form method="POST" action="{{ url_for('mapel.edit', id=mapel.id) }}" novalidate class="p-8 space-y-6">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2" for="nama">
          Nama Mata Pelajaran <span class="text-red-400">*</span>
        </label>
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <i class="ph ph-book-open-text text-gray-400 text-lg group-focus-within:text-cyan-500 transition-colors"></i>
          </div>
          <input type="text" id="nama" name="nama" value="{{ mapel.nama }}" required
            class="w-full pl-11 pr-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-cyan-400 focus:border-cyan-400 transition-all text-sm shadow-sm"/>
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2" for="kode">
          Kode <span class="text-red-400">*</span>
        </label>
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <i class="ph ph-barcode text-gray-400 text-lg group-focus-within:text-cyan-500 transition-colors"></i>
          </div>
          <input type="text" id="kode" name="kode" value="{{ mapel.kode }}" required maxlength="20"
            class="w-full pl-11 pr-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-cyan-400 focus:border-cyan-400 transition-all text-sm shadow-sm"/>
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2" for="deskripsi">
          Deskripsi <span class="text-gray-400 font-normal">(opsional)</span>
        </label>
        <textarea id="deskripsi" name="deskripsi" rows="3"
          class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-cyan-400 focus:border-cyan-400 transition-all text-sm shadow-sm">{{ mapel.deskripsi or '' }}</textarea>
      </div>

      <!-- Actions -->
      <div class="flex gap-4 pt-4">
        <button type="submit" class="flex-1 flex justify-center items-center gap-2 py-3.5 px-6 rounded-2xl font-bold text-white bg-cyan-500 hover:bg-cyan-600 shadow-lg shadow-cyan-200 hover:-translate-y-0.5 transition-all duration-200">
          <i class="ph-bold ph-floppy-disk text-lg"></i> Perbarui Mapel
        </button>
        <a href="{{ url_for('mapel.index') }}" class="flex-1 flex items-center justify-center gap-2 py-3.5 px-5 rounded-2xl font-semibold text-gray-600 bg-white border border-gray-200 hover:bg-gray-50 shadow-sm transition-all">
          <i class="ph-bold ph-arrow-left"></i> Batal
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
