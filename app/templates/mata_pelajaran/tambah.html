{% extends 'base.html' %}
{% block title %}Tambah Mata Pelajaran{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Tambah Mata Pelajaran</h1>
  <div class="breadcrumb"><a href="{{ url_for('mapel.index') }}" class="text-muted">Mata Pelajaran</a> › <span>Tambah</span></div>
</div>
<div class="card" style="max-width:560px;">
  <div class="card-header">
    <span class="card-title"><i class="fa-solid fa-plus text-cyan" style="margin-right:8px;"></i>Form Tambah Mata Pelajaran</span>
  </div>
  <form method="POST" action="{{ url_for('mapel.tambah') }}" novalidate id="form-tambah-mapel">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <div class="form-group">
      <label class="form-label" for="nama">Nama Mata Pelajaran</label>
      <input type="text" id="nama" name="nama" class="form-control" placeholder="Contoh: Matematika" required/>
    </div>
    <div class="form-group">
      <label class="form-label" for="kode">Kode</label>
      <input type="text" id="kode" name="kode" class="form-control" placeholder="Contoh: MTK" required maxlength="20"/>
      <small class="text-muted text-sm">Kode akan otomatis diubah ke huruf kapital.</small>
    </div>
    <div class="form-group">
      <label class="form-label" for="deskripsi">Deskripsi <span class="text-muted">(opsional)</span></label>
      <textarea id="deskripsi" name="deskripsi" class="form-control" placeholder="Deskripsi singkat mata pelajaran..."></textarea>
    </div>
    <div class="flex gap-3 mt-2">
      <button type="submit" class="btn btn-primary" id="btn-simpan-mapel">
        <i class="fa-solid fa-floppy-disk"></i> Simpan
      </button>
      <a href="{{ url_for('mapel.index') }}" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Batal</a>
    </div>
  </form>
</div>
{% endblock %}
