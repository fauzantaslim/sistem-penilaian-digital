{% extends 'base.html' %}
{% block title %}Tambah Kunci Jawaban{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Tambah Kunci Jawaban</h1>
  <div class="breadcrumb"><a href="{{ url_for('kunci.index') }}" class="text-muted">Kunci Jawaban</a> › <span>Tambah</span></div>
</div>
<div class="card" style="max-width:560px;">
  <div class="card-header">
    <span class="card-title"><i class="fa-solid fa-key text-orange" style="margin-right:8px;"></i>Form Tambah Kunci Jawaban</span>
  </div>
  <form method="POST" action="{{ url_for('kunci.tambah') }}" novalidate id="form-tambah-kunci">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <div class="form-group">
      <label class="form-label" for="mapel_id">Mata Pelajaran</label>
      <select id="mapel_id" name="mapel_id" class="form-select" required>
        <option value="">— Pilih Mata Pelajaran —</option>
        {% for m in mapel_list %}
        <option value="{{ m.id }}">[{{ m.kode }}] {{ m.nama }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label" for="nomor_soal">Nomor Soal</label>
        <input type="number" id="nomor_soal" name="nomor_soal" class="form-control" min="1" max="200" placeholder="1" required/>
      </div>
      <div class="form-group">
        <label class="form-label" for="jawaban_benar">Jawaban Benar</label>
        <select id="jawaban_benar" name="jawaban_benar" class="form-select" required>
          <option value="">— Pilih —</option>
          {% for o in opsi %}
          <option value="{{ o }}">{{ o }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="flex gap-3 mt-2">
      <button type="submit" class="btn btn-primary" id="btn-simpan-kunci">
        <i class="fa-solid fa-floppy-disk"></i> Simpan
      </button>
      <a href="{{ url_for('kunci.index') }}" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Batal</a>
    </div>
  </form>
</div>
{% endblock %}
