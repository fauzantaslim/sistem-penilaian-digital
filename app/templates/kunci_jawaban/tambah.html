{% extends 'base.html' %}
{% block title %}Tambah Kunci Jawaban{% endblock %}
{% block page_title %}Tambah Kunci Jawaban{% endblock %}

{% block content %}
<!-- Form Card -->
<div class="w-full animate-fade-in animate-in-1">
  <div class="bg-transparent border border-gray-200/80 rounded-3xl overflow-hidden">
    <!-- Card Header -->
    <div class="px-8 py-5 bg-gray-900 text-white flex items-center gap-3">
      <i class="ph-fill ph-key text-orange-400 text-2xl"></i>
      <div>
        <h2 class="font-display font-bold text-white">Form Tambah Kunci Jawaban</h2>
        <p class="text-xs text-gray-300 mt-0.5">Isi semua data yang diperlukan</p>
      </div>
    </div>

    <!-- Form Body -->
    <form method="POST" action="{{ url_for('kunci.tambah') }}" novalidate class="p-8 space-y-6">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2" for="mapel_id">
          Mata Pelajaran <span class="text-red-400">*</span>
        </label>
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <i class="ph ph-books text-gray-400 text-lg group-focus-within:text-orange-500 transition-colors"></i>
          </div>
          <select id="mapel_id" name="mapel_id" required
            class="w-full pl-11 pr-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-400 focus:border-orange-400 transition-all text-sm appearance-none cursor-pointer shadow-sm">
            <option value="">— Pilih Mata Pelajaran —</option>
            {% for m in mapel_list %}
            <option value="{{ m.id }}">[{{ m.kode }}] {{ m.nama }}</option>
            {% endfor %}
          </select>
          <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
            <i class="ph ph-caret-down text-gray-400"></i>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2" for="nomor_soal">
            Nomor Soal <span class="text-red-400">*</span>
          </label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i class="ph ph-list-numbers text-gray-400 text-lg group-focus-within:text-orange-500 transition-colors"></i>
            </div>
            <input type="number" id="nomor_soal" name="nomor_soal" min="1" max="200" required
              class="w-full pl-11 pr-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-400 focus:border-orange-400 transition-all text-sm placeholder-gray-400 shadow-sm"
              placeholder="Contoh: 1"/>
          </div>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2" for="jawaban_benar">
            Jawaban Benar <span class="text-red-400">*</span>
          </label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i class="ph ph-check-circle text-gray-400 text-lg group-focus-within:text-orange-500 transition-colors"></i>
            </div>
            <select id="jawaban_benar" name="jawaban_benar" required
              class="w-full pl-11 pr-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-400 focus:border-orange-400 transition-all text-sm appearance-none cursor-pointer shadow-sm">
              <option value="">— Pilih —</option>
              {% for o in opsi %}
              <option value="{{ o }}">{{ o }}</option>
              {% endfor %}
            </select>
            <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
              <i class="ph ph-caret-down text-gray-400"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex gap-4 pt-4">
        <button type="submit" class="flex-1 flex justify-center items-center gap-2 py-3.5 px-6 rounded-2xl font-bold text-white bg-orange-500 hover:bg-orange-600 shadow-lg shadow-orange-200 hover:-translate-y-0.5 transition-all duration-200">
          <i class="ph-bold ph-floppy-disk text-lg"></i> Simpan Kunci
        </button>
        <a href="{{ url_for('kunci.index') }}" class="flex-1 flex items-center justify-center gap-2 py-3.5 px-5 rounded-2xl font-semibold text-gray-600 bg-white border border-gray-200 hover:bg-gray-50 shadow-sm transition-all">
          <i class="ph-bold ph-arrow-left"></i> Batal
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
