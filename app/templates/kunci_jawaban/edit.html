{% extends 'base.html' %}
{% block title %}Edit Kunci Jawaban{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Edit Kunci Jawaban</h1>
  <div class="breadcrumb"><a href="{{ url_for('kunci.index') }}" class="text-muted">Kunci Jawaban</a> › <span>Edit Soal {{ kunci.nomor_soal }}</span></div>
</div>
<div class="card" style="max-width:560px;">
  <div class="card-header">
    <span class="card-title"><i class="fa-solid fa-pen-to-square text-orange" style="margin-right:8px;"></i>Edit Kunci Jawaban</span>
  </div>
  <form method="POST" action="{{ url_for('kunci.edit', id=kunci.id) }}" novalidate id="form-edit-kunci">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <div class="form-group">
      <label class="form-label">Mata Pelajaran</label>
      <input type="text" class="form-control" value="{{ kunci.mata_pelajaran.nama }}" readonly
             style="opacity:0.6;cursor:not-allowed;"/>
    </div>
    <div class="form-group">
      <label class="form-label">Nomor Soal</label>
      <input type="text" class="form-control" value="Soal {{ kunci.nomor_soal }}" readonly
             style="opacity:0.6;cursor:not-allowed;"/>
    </div>
    <div class="form-group">
      <label class="form-label" for="jawaban_benar">Jawaban Benar</label>
      <select id="jawaban_benar" name="jawaban_benar" class="form-select" required>
        {% for o in opsi %}
        <option value="{{ o }}" {% if o == kunci.jawaban_benar %}selected{% endif %}>{{ o }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="flex gap-3 mt-2">
      <button type="submit" class="btn btn-primary" id="btn-update-kunci">
        <i class="fa-solid fa-floppy-disk"></i> Perbarui
      </button>
      <a href="{{ url_for('kunci.index', mapel_id=kunci.mapel_id) }}" class="btn btn-outline">
        <i class="fa-solid fa-arrow-left"></i> Batal
      </a>
    </div>
  </form>
</div>
{% endblock %}
