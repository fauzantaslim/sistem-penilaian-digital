{% macro submit_button(text, icon_class="") %}
<button type="submit" class="w-full flex justify-center items-center gap-2 py-3.5 px-4 rounded-2xl shadow-[0_8px_20px_rgba(122,203,175,0.3)] text-sm font-bold text-white bg-primary hover:bg-primary-dark hover:-translate-y-1 transition-all duration-300">
  {{ text }}
  {% if icon_class %}
  <i class="{{ icon_class }}"></i>
  {% endif %}
</button>
{% endmacro %}
