{% extends 'base.html' %}
{% block title %}Tambah Siswa{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Tambah Siswa</h1>
  <div class="breadcrumb">
    <a href="{{ url_for('siswa.index') }}" class="text-muted">Data Siswa</a> ›
    <span>Tambah</span>
  </div>
</div>

<div class="card" style="max-width:560px;">
  <div class="card-header">
    <span class="card-title"><i class="fa-solid fa-user-plus text-purple" style="margin-right:8px;"></i>Form Tambah Siswa</span>
  </div>

  <form method="POST" action="{{ url_for('siswa.tambah') }}" novalidate id="form-tambah-siswa">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

    <div class="form-group">
      <label class="form-label" for="nama">Nama Lengkap</label>
      <input type="text" id="nama" name="nama" class="form-control"
             placeholder="Masukkan nama lengkap siswa" required/>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label class="form-label" for="nis">NIS</label>
        <input type="text" id="nis" name="nis" class="form-control"
               placeholder="Nomor Induk Siswa" required/>
      </div>
      <div class="form-group">
        <label class="form-label" for="kelas">Kelas</label>
        <input type="text" id="kelas" name="kelas" class="form-control"
               placeholder="Contoh: X IPA 1" required/>
      </div>
    </div>

    <div class="flex gap-3 mt-2">
      <button type="submit" class="btn btn-primary" id="btn-simpan-siswa">
        <i class="fa-solid fa-floppy-disk"></i> Simpan
      </button>
      <a href="{{ url_for('siswa.index') }}" class="btn btn-outline">
        <i class="fa-solid fa-arrow-left"></i> Batal
      </a>
    </div>
  </form>
</div>
{% endblock %}
