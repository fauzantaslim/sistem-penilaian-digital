{% extends 'base.html' %}
{% block title %}Tambah Siswa{% endblock %}
{% block page_title %}Tambah Siswa{% endblock %}

{% block content %}
<!-- Form Card -->
<div class="w-full animate-fade-in animate-in-1">
  <div class="bg-transparent border border-gray-200/80 rounded-3xl overflow-hidden">
    <!-- Card Header -->
    <div class="px-8 py-5 bg-gray-900 text-white flex items-center gap-3">
      <i class="ph-fill ph-user-plus text-primary text-2xl"></i>
      <div>
        <h2 class="font-display font-bold text-white">Form Tambah Siswa</h2>
        <p class="text-xs text-gray-300 mt-0.5">Isi semua data yang diperlukan</p>
      </div>
    </div>

    <!-- Form Body -->
    <form method="POST" action="{{ url_for('siswa.tambah') }}" novalidate class="p-8 space-y-6">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2" for="nama">
          Nama Lengkap <span class="text-red-400">*</span>
        </label>
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <i class="ph ph-identification-card text-gray-400 text-lg group-focus-within:text-primary transition-colors"></i>
          </div>
          <input type="text" id="nama" name="nama" required
            class="w-full pl-11 pr-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-all text-sm placeholder-gray-400 shadow-sm"
            placeholder="Masukkan nama lengkap siswa" autofocus/>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2" for="nis">
            NIS <span class="text-red-400">*</span>
          </label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i class="ph ph-hash text-gray-400 text-lg group-focus-within:text-primary transition-colors"></i>
            </div>
            <input type="text" id="nis" name="nis" required
              class="w-full pl-11 pr-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-all text-sm placeholder-gray-400 shadow-sm"
              placeholder="Nomor Induk"/>
          </div>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2" for="kelas">
            Kelas <span class="text-red-400">*</span>
          </label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i class="ph ph-chalkboard-teacher text-gray-400 text-lg group-focus-within:text-primary transition-colors"></i>
            </div>
            <input type="text" id="kelas" name="kelas" required
              class="w-full pl-11 pr-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-all text-sm placeholder-gray-400 shadow-sm"
              placeholder="Contoh: X IPA 1"/>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex gap-4 pt-4">
        <button type="submit" class="flex-1 flex justify-center items-center gap-2 py-3.5 px-6 rounded-2xl font-bold text-white bg-primary hover:bg-primary-dark shadow-lg shadow-primary/30 hover:-translate-y-0.5 transition-all duration-200">
          <i class="ph-bold ph-floppy-disk text-lg"></i> Simpan Siswa
        </button>
        <a href="{{ url_for('siswa.index') }}" class="flex-1 flex items-center justify-center gap-2 py-3.5 px-5 rounded-2xl font-semibold text-gray-600 bg-white border border-gray-200 hover:bg-gray-50 shadow-sm transition-all">
          <i class="ph-bold ph-arrow-left"></i> Batal
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
